<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminBot | Alertas</title>

    <link rel="stylesheet" href="../../shared/css/layout.css">

    <style>
        .alert-card {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
        }

        .alert-icon {
            font-size: 1.5rem;
        }

        .alert-info {
            flex: 1;
        }

        .alert-time {
            font-size: .8rem;
            color: #888;
        }

        .btn-wa {
            background: #932e71;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: .3s;
        }

        .btn-wa:hover {
            transform: scale(1.05);
            opacity: .9;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <aside class="sidebar">

            <div class="sidebar-header">
                <div class="logo-icon"></div>
                <h2>AdminBot</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="../dashboard/index.html" class="nav-item">🏠 Dashboard</a>
                <a href="../students/index.html" class="nav-item">👥 Estudiantes</a>
                <a href="../attendance/index.html" class="nav-item">📅 Asistencia</a>
                <a href="../payments/index.html" class="nav-item">💰 Pagos</a>
                <a href="../alerts/index.html" class="nav-item active">🔔 Alertas</a>
                <a href="../settings/index.html" class="nav-item">⚙️ Configuración</a>
            </nav>

        </aside>

        <div class="main-layout">

            <header class="top-header"
                style="display:flex; justify-content:space-between; align-items:center;">

                <h1>Historial de Alertas</h1>

                <button id="btn-masivo" class="btn-wa">
                    📲 Enviar Masivo
                </button>

            </header>

            <main class="content-body" id="alerts-container">

                <div class="card alert-card">

                    <div class="alert-icon">📱</div>

                    <div class="alert-info">
                        <strong>Mensaje de prueba</strong>
                        <p>Número: +57 300 839 9445</p>
                    </div>

                    <div class="alert-time">
                        Hoy
                    </div>

                </div>

            </main>

        </div>

    </div>

    <script src="./alerts.js"></script>

</body>

</html>
